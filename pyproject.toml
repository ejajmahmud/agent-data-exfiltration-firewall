[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-data-exfiltration-firewall"
version = "0.1.0"
description = "Outbound traffic egress filter scanning HTTP/DNS requests made by agent tools for encoded secrets, keys, and PII"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-data-exfiltration-firewall = "agent_data_exfiltration_firewall.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_data_exfiltration_firewall*"]
